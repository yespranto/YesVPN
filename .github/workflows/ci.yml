name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch pinned third-party binaries
        shell: pwsh
        run: ./scripts/fetch-third-party.ps1

      - name: Restore dependencies
        run: dotnet restore YesVPN.sln

      - name: Build Release
        run: dotnet build YesVPN.sln -c Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test YesVPN.sln -c Release --no-build --verbosity normal
